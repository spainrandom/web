<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Galería VIP</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    overflow: hidden;
    transition: filter 1.2s ease, transform 1.2s ease;
}

/* ===== OVERLAY ===== */
#overlay {
    position: fixed;
    inset: 0;
    backdrop-filter: blur(18px);
    background: rgba(0,0,0,0.65);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    transition: 0.5s;
}

.overlay-card {
    text-align: center;
    color: white;
    background: rgba(15, 23, 42, 0.75);
    padding: 45px 35px;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(0,0,0,0.6);
    animation: popIn 0.5s ease;
    max-width: 420px;
}

.overlay-icon {
    font-size: 55px;
    margin-bottom: 10px;
    animation: pulse 1.8s infinite;
}

/* BOTONES */
.buttons { display: flex; gap: 15px; justify-content: center; }

button {
    padding: 14px 20px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

#yes { background: #22c55e; color: white; }
#no { background: #ef4444; color: white; }

/* GRID */
h1 {
    position: fixed;
    top: 10px;
    left: 15px;
    color: white;
    font-size: 14px;
    opacity: 0.7;
    z-index: 10;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    grid-auto-rows: 120px;
    grid-auto-flow: dense;
    gap: 6px;
    padding: 10px;
}

.card {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    transition: 0.3s;
    cursor: pointer;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.85);
    transition: 0.3s;
}

.card span {
    position: absolute;
    bottom: 5px;
    left: 5px;
    font-size: 10px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 2px 5px;
    border-radius: 5px;
}

.big { grid-column: span 2; grid-row: span 2; }
.wide { grid-column: span 2; }
.tall { grid-row: span 2; }

.card:nth-child(odd) { transform: rotate(-1deg); }
.card:nth-child(even) { transform: rotate(1deg); }

.card:hover {
    transform: scale(1.07) rotate(0deg);
    z-index: 2;
}

/* ===== NIEBLA REAL ===== */
.fog {
    position: fixed;
    inset: 0;
    z-index: 800;
    pointer-events: none;
    opacity: 0;

    background:
        radial-gradient(circle at center, rgba(255,255,255,0.15), rgba(255,255,255,0.8)),
        url("https://www.transparenttextures.com/patterns/cloudy.png");

    background-size: cover, 300px 300px;
    filter: blur(6px);

    animation: fogIn 1.2s forwards, fogMove 25s linear infinite;
}

@keyframes fogIn {
    0% { opacity: 0; }
    60% { opacity: 0.5; }
    100% { opacity: 0.9; }
}

@keyframes fogMove {
    from { background-position: center, 0 0; }
    to { background-position: center, 400px 200px; }
}

/* DESVANECIMIENTO SUAVE */
.fadeOut {
    animation: fadeSoft 1.2s forwards;
}

@keyframes fadeSoft {
    0% {
        transform: scale(1);
        filter: blur(0px) brightness(1);
    }
    50% {
        transform: scale(0.99);
        filter: blur(2px) brightness(0.95);
    }
    100% {
        transform: scale(0.97);
        filter: blur(4px) brightness(0.85);
    }
}

/* FLASH FINAL */
.flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    z-index: 9999;
    animation: flash 0.6s forwards;
}

@keyframes flash {
    0% { opacity: 0; }
    40% { opacity: 0.6; }
    100% { opacity: 0; }
}

@keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}
</style>
</head>

<body>

<div id="overlay">
    <div class="overlay-card">
        <div class="overlay-icon">🔞</div>
        <h2>¿Eres mayor de 18 años?</h2>
        <p>Accede a la galería de la comunidad</p>

        <div class="buttons">
            <button id="yes">Sí</button>
            <button id="no">No</button>
        </div>
    </div>
</div>

<h1>📸 La Galería VIP</h1>
<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById("grid");

const patterns = ["", "big", "", "tall", "", "wide", "", "", "big", ""];

for (let i = 1; i <= 1000; i++) {
    const div = document.createElement("div");
    div.className = "card " + patterns[i % patterns.length];

    div.innerHTML = `
        <img src="https://picsum.photos/400?random=${i}" loading="lazy">
        <span>Usuario ${i}</span>
    `;

    grid.appendChild(div);
}

/* ===== EFECTO NIEBLA PRO ===== */
let animando = false;

window.addEventListener("scroll", () => {
    if (animando) return;

    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 5) {
        animando = true;

        document.body.classList.add("fadeOut");

        // capa 1
        const fog1 = document.createElement("div");
        fog1.className = "fog";
        document.body.appendChild(fog1);

        // capa 2 (profundidad)
        const fog2 = document.createElement("div");
        fog2.className = "fog";
        fog2.style.opacity = "0.5";
        fog2.style.animationDuration = "35s";
        document.body.appendChild(fog2);

        setTimeout(() => {
            const flash = document.createElement("div");
            flash.className = "flash";
            document.body.appendChild(flash);
        }, 900);

        setTimeout(() => {
            window.scrollTo(0, 0);

            document.body.classList.remove("fadeOut");
            fog1.remove();
            fog2.remove();

            animando = false;
        }, 1400);
    }
});

/* ===== OVERLAY ===== */
document.getElementById("yes").onclick = () => {
    const overlay = document.getElementById("overlay");
    overlay.style.opacity = "0";
    overlay.style.transform = "scale(1.1)";

    setTimeout(() => {
        overlay.style.display = "none";
        document.body.style.overflow = "auto";
    }, 400);
};

document.getElementById("no").onclick = () => {
    window.location.href = "https://www.youtube.com/watch?v=XqZsoesa55w";
};
</script>

</body>
</html>
