<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Galería VIP</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    overflow: hidden;
}

/* ===== OVERLAY ===== */
#overlay {
    position: fixed;
    inset: 0;
    backdrop-filter: blur(18px);
    background: rgba(0,0,0,0.65);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    transition: 0.5s;
}

.overlay-card {
    text-align: center;
    color: white;
    background: rgba(15, 23, 42, 0.75);
    padding: 45px 35px;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(0,0,0,0.6);
    animation: popIn 0.5s ease;
    max-width: 420px;
}

.overlay-icon {
    font-size: 55px;
    margin-bottom: 10px;
    animation: pulse 1.8s infinite;
}

/* BOTONES */
.buttons { display: flex; gap: 15px; justify-content: center; }

button {
    padding: 14px 20px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

#yes { background: #22c55e; color: white; }
#no { background: #ef4444; color: white; }

/* GRID */
h1 {
    position: fixed;
    top: 10px;
    left: 15px;
    color: white;
    font-size: 14px;
    opacity: 0.7;
    z-index: 10;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    grid-auto-rows: 120px;
    grid-auto-flow: dense;
    gap: 6px;
    padding: 10px;
}

.card {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    transition: 0.3s;
    cursor: pointer;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.85);
}

.card span {
    position: absolute;
    bottom: 5px;
    left: 5px;
    font-size: 10px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 2px 5px;
    border-radius: 5px;
}

.big { grid-column: span 2; grid-row: span 2; }
.wide { grid-column: span 2; }
.tall { grid-row: span 2; }

/* ===== AGUJERO NEGRO SUAVE ===== */
.blackhole {
    animation: smoothSuck 1.4s ease-in forwards;
    transform-origin: center center;
}

@keyframes smoothSuck {
    0% {
        transform: scale(1);
        filter: brightness(1);
    }
    40% {
        transform: scale(0.95);
        filter: brightness(0.9);
    }
    70% {
        transform: scale(0.6);
        filter: blur(4px) brightness(0.8);
    }
    100% {
        transform: scale(0.2);
        filter: blur(12px) brightness(0.6);
    }
}

/* VIGNETTE (profesional) */
.vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.8) 70%);
    opacity: 0;
    z-index: 500;
    pointer-events: none;
    animation: vignetteIn 1.4s forwards;
}

@keyframes vignetteIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* FLASH FINAL */
.flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    z-index: 9999;
    animation: flash 0.6s forwards;
}

@keyframes flash {
    0% { opacity: 0; }
    40% { opacity: 0.7; }
    100% { opacity: 0; }
}

@keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}
</style>
</head>

<body>

<div id="overlay">
    <div class="overlay-card">
        <div class="overlay-icon">🔞</div>
        <h2>¿Eres mayor de 18 años?</h2>
        <p>Accede a la galería de la comunidad</p>

        <div class="buttons">
            <button id="yes">Sí</button>
            <button id="no">No</button>
        </div>
    </div>
</div>

<h1>📸 La Galería VIP</h1>
<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById("grid");

const patterns = ["", "big", "", "tall", "", "wide", "", "", "big", ""];

for (let i = 1; i <= 1000; i++) {
    const div = document.createElement("div");
    div.className = "card " + patterns[i % patterns.length];

    div.innerHTML = `
        <img src="https://picsum.photos/400?random=${i}" loading="lazy">
        <span>Usuario ${i}</span>
    `;

    grid.appendChild(div);
}

/* ===== EFECTO PROFESIONAL ===== */
let animando = false;

window.addEventListener("scroll", () => {
    if (animando) return;

    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 5) {
        animando = true;

        document.body.classList.add("blackhole");

        const vignette = document.createElement("div");
        vignette.className = "vignette";
        document.body.appendChild(vignette);

        setTimeout(() => {
            const flash = document.createElement("div");
            flash.className = "flash";
            document.body.appendChild(flash);
        }, 900);

        setTimeout(() => {
            window.scrollTo(0, 0);

            document.body.classList.remove("blackhole");
            vignette.remove();

            animando = false;
        }, 1400);
    }
});

/* ===== OVERLAY ===== */
document.getElementById("yes").onclick = () => {
    const overlay = document.getElementById("overlay");
    overlay.style.opacity = "0";
    overlay.style.transform = "scale(1.1)";

    setTimeout(() => {
        overlay.style.display = "none";
        document.body.style.overflow = "auto";
    }, 400);
};

document.getElementById("no").onclick = () => {
    window.location.href = "https://www.youtube.com/watch?v=XqZsoesa55w";
};
</script>

</body>
</html>
