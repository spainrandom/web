<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Galería VIP</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #020617, #0f172a 70%);
    overflow: hidden;
    transition: transform 1s ease, filter 1s ease;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    grid-auto-rows: 120px;
    gap: 6px;
    padding: 10px;
}

.card {
    border-radius: 12px;
    overflow: hidden;
    transform: rotate(1deg);
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ===== VORTEX CANVAS ===== */
#vortexCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
}

/* ===== EFECTO SUCCIÓN ===== */
.blackhole {
    animation: vortexPull 1.2s forwards ease-in;
}

@keyframes vortexPull {
    0% {
        transform: scale(1) rotate(0deg);
        filter: blur(0px);
    }
    40% {
        transform: scale(1.1) rotate(5deg);
        filter: blur(2px);
    }
    80% {
        transform: scale(0.2) rotate(25deg);
        filter: blur(12px);
    }
    100% {
        transform: scale(0);
        filter: blur(30px);
    }
}

/* FLASH */
.flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    z-index: 9999;
    animation: flash 0.5s forwards;
}

@keyframes flash {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
}
</style>
</head>

<body>

<canvas id="vortexCanvas"></canvas>
<div class="grid" id="grid"></div>

<script>
/* ===== GRID ===== */
const grid = document.getElementById("grid");

for (let i = 1; i <= 800; i++) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="https://picsum.photos/400?random=${i}">`;
    grid.appendChild(div);
}

/* ===== VORTEX PARTICLES ===== */
const canvas = document.getElementById("vortexCanvas");
const ctx = canvas.getContext("2d");

let w, h, cx, cy;
function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cx = w / 2;
    cy = h / 2;
}
window.addEventListener("resize", resize);
resize();

let particles = [];

function createParticles() {
    particles = [];
    for (let i = 0; i < 400; i++) {
        particles.push({
            angle: Math.random() * Math.PI * 2,
            radius: Math.random() * Math.max(w, h),
            speed: 0.02 + Math.random() * 0.05,
            size: Math.random() * 2
        });
    }
}

function drawParticles() {
    ctx.clearRect(0, 0, w, h);

    particles.forEach(p => {
        p.angle += p.speed;
        p.radius *= 0.97;

        const x = cx + Math.cos(p.angle) * p.radius;
        const y = cy + Math.sin(p.angle) * p.radius;

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.fill();
    });
}

let vortexActive = false;

function animate() {
    if (vortexActive) drawParticles();
    requestAnimationFrame(animate);
}
animate();

/* ===== SONIDO ===== */
const audio = new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9bce9f.mp3?filename=whoosh-6316.mp3");

/* ===== SCROLL TRIGGER ===== */
let animando = false;

window.addEventListener("scroll", () => {
    if (animando) return;

    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 5) {
        animando = true;
        vortexActive = true;

        createParticles();
        audio.currentTime = 0;
        audio.play();

        document.body.classList.add("blackhole");

        const flash = document.createElement("div");
        flash.className = "flash";
        document.body.appendChild(flash);

        setTimeout(() => {
            window.scrollTo(0, 0);

            document.body.classList.remove("blackhole");
            flash.remove();

            vortexActive = false;
            animando = false;
        }, 1200);
    }
});
</script>

</body>
</html>
