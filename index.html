<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Galería VIP</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    overflow: hidden;
}

/* ===== OVERLAY +18 ===== */
#overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(12px);
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999;
    color: white;
    text-align: center;
}

#overlay h2 {
    font-size: 28px;
    margin-bottom: 20px;
}

.buttons {
    display: flex;
    gap: 20px;
}

button {
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

#yes {
    background: #22c55e;
    color: white;
}

#yes:hover {
    background: #16a34a;
    transform: scale(1.05);
}

#no {
    background: #ef4444;
    color: white;
}

#no:hover {
    background: #dc2626;
    transform: scale(1.05);
}

/* ===== WEB ===== */
h1 {
    position: fixed;
    top: 10px;
    left: 15px;
    color: white;
    font-size: 14px;
    opacity: 0.7;
    z-index: 10;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    grid-auto-rows: 120px;
    grid-auto-flow: dense;
    gap: 6px;
    padding: 10px;
}

.card {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    transition: 0.3s;
    cursor: pointer;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.85);
    transition: 0.3s;
}

.card span {
    position: absolute;
    bottom: 5px;
    left: 5px;
    font-size: 10px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 2px 5px;
    border-radius: 5px;
}

/* tamaños */
.big { grid-column: span 2; grid-row: span 2; }
.wide { grid-column: span 2; }
.tall { grid-row: span 2; }

.card:nth-child(odd) { transform: rotate(-1deg); }
.card:nth-child(even) { transform: rotate(1deg); }

.card:hover {
    transform: scale(1.07) rotate(0deg);
    z-index: 2;
}

.card:hover img {
    filter: brightness(1);
}
</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
    <h2>🔞 ¿Eres mayor de 18 años?</h2>
    <div class="buttons">
        <button id="yes">Sí, soy mayor de 18 años</button>
        <button id="no">No, no soy mayor de 18 años</button>
    </div>
</div>

<h1>📸 La Galería VIP</h1>

<div class="grid">

<!-- 200 imágenes generadas -->
<script>
const grid = document.currentScript.parentElement;

const names = [
"Ana","Carlos","Lucía","David","María","Javi","Sara","Pedro","Laura","Raúl",
"Elena","Iván","Nuria","Pablo","Clara","Adrián","Rosa","Diego","Marta","Alex",
"Julia","Hugo","Sofía","Bruno","Alicia","Tomás","Vera","Leo","Noa","Eric",
"Paula","Mario","Alba","Samuel","Inés","Joel","Carmen","Gonzalo","Patri","Dani",
"Lola","Ángel","Eva","Rubén","Nico","Silvia","Lucas","Valeria","Andrés","Emma"
];

for (let i = 1; i <= 200; i++) {
    const div = document.createElement("div");
    div.className = "card";

    const types = ["", "big", "wide", "tall"];
    const type = types[Math.floor(Math.random() * types.length)];
    if (type) div.classList.add(type);

    const name = names[Math.floor(Math.random() * names.length)];

    div.innerHTML = `
        <img src="https://picsum.photos/400?random=${i}">
        <span>${name}</span>
    `;

    grid.appendChild(div);
}
</script>

</div>

<!-- JS OVERLAY -->
<script>
document.getElementById("yes").onclick = () => {
    document.getElementById("overlay").style.display = "none";
    document.body.style.overflow = "auto";
};

document.getElementById("no").onclick = () => {
    window.location.href = "https://www.google.com";
};
</script>

</body>
</html>
