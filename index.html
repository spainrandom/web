<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Galería VIP</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    overflow: hidden;
}

/* ===== OVERLAY ===== */
#overlay {
    position: fixed;
    inset: 0;
    backdrop-filter: blur(18px);
    background: rgba(0,0,0,0.65);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    transition: 0.5s;
}

.overlay-card {
    text-align: center;
    color: white;
    background: rgba(15, 23, 42, 0.75);
    padding: 45px 35px;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(0,0,0,0.6);
    animation: popIn 0.5s ease;
    max-width: 420px;
}

.overlay-icon {
    font-size: 55px;
    margin-bottom: 10px;
    animation: pulse 1.8s infinite;
}

/* BOTONES */
.buttons { 
    display: flex; 
    gap: 15px; 
    justify-content: center; 
}

button {
    padding: 14px 20px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    position: relative;
    overflow: hidden;
}

/* ===== EFECTO LUZ BLANCA ===== */
button::after {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.7),
        transparent
    );
    transform: skewX(-20deg);
}

button:hover::after {
    animation: shine 0.9s ease;
}

@keyframes shine {
    0% { left: -75%; }
    100% { left: 130%; }
}

/* COLORES BOTONES */
#yes { background: #22c55e; color: white; }
#no { background: #ef4444; color: white; }

/* GRID */
h1 {
    position: fixed;
    top: 10px;
    left: 15px;
    color: white;
    font-size: 14px;
    opacity: 0.7;
    z-index: 10;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    grid-auto-rows: 120px;
    grid-auto-flow: dense;
    gap: 6px;
    padding: 10px;
}

.card {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    cursor: pointer;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card span {
    position: absolute;
    bottom: 5px;
    left: 5px;
    font-size: 10px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 2px 5px;
    border-radius: 5px;
}

.big { grid-column: span 2; grid-row: span 2; }
.wide { grid-column: span 2; }
.tall { grid-row: span 2; }

/* ===== VISOR IMAGEN ===== */
.viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.viewer img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
}

.close-btn {
    position: absolute;
    top: 20px;
    right: 25px;
    font-size: 30px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

/* ANIMACIONES */
@keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}
</style>
</head>

<body>

<div id="overlay">
    <div class="overlay-card">
        <div class="overlay-icon">🔞</div>
        <h2>¿Eres mayor de 18 años?</h2>
        <p>Accede a la galería de la comunidad</p>

        <div class="buttons">
            <button id="yes">Sí</button>
            <button id="no">No</button>
        </div>
    </div>
</div>

<h1>📸 Forma parte de la Comunidad </h1>
<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById("grid");

const patterns = ["", "big", "", "tall", "", "wide", "", "", "big", ""];

for (let i = 1; i <= 1000; i++) {
    const div = document.createElement("div");
    div.className = "card " + patterns[i % patterns.length];

    const img = document.createElement("img");

    if (i === 1) {
        img.src = "files/byjose07.jpeg"; // tu imagen
    } else {
        img.src = `https://picsum.photos/400?random=${i}`;
    }
    
    img.loading = "lazy";
    
    const span = document.createElement("span");
    
    if (i === 1) {
        span.textContent = "byjose07"; // tu nombre
    } else {
        span.textContent = "Usuario " + i;
    }

    div.appendChild(img);
    div.appendChild(span);

    div.onclick = () => openViewer(img.src);

    grid.appendChild(div);
}

/* SCROLL */
window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 5) {
        window.scrollTo(0, 0);
    }
});

/* VISOR */
function openViewer(src) {
    const viewer = document.createElement("div");
    viewer.className = "viewer";

    const image = document.createElement("img");
    image.src = src;

    const close = document.createElement("div");
    close.className = "close-btn";
    close.innerHTML = "✕";

    close.onclick = () => viewer.remove();

    viewer.appendChild(image);
    viewer.appendChild(close);

    document.body.appendChild(viewer);
}

/* OVERLAY */
document.getElementById("yes").onclick = () => {
    const overlay = document.getElementById("overlay");
    overlay.style.opacity = "0";
    overlay.style.transform = "scale(1.1)";

    setTimeout(() => {
        overlay.style.display = "none";
        document.body.style.overflow = "auto";
    }, 400);
};

document.getElementById("no").onclick = () => {
    window.location.href = "https://www.youtube.com/watch?v=XqZsoesa55w";
};
</script>

</body>
</html>
