<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Galería VIP</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    overflow: hidden;
}

/* ===== OVERLAY ===== */
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(18px);
    background: rgba(0,0,0,0.65);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    transition: 0.5s;
}

.overlay-card {
    text-align: center;
    color: white;
    background: rgba(15, 23, 42, 0.75);
    padding: 45px 35px;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(0,0,0,0.6);
    animation: popIn 0.5s ease;
    max-width: 420px;
}

.overlay-icon {
    font-size: 55px;
    margin-bottom: 10px;
    animation: pulse 1.8s infinite;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
}

.overlay-card h2 {
    font-size: 26px;
    margin: 10px 0;
}

.overlay-card p {
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 25px;
}

/* ===== BOTONES PRO ===== */
.buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
}

button {
    position: relative;
    padding: 14px 20px;
    font-size: 14px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-weight: bold;
    overflow: hidden;
    transition: 0.25s;
}

/* brillo animado */
button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
    transition: 0.6s;
}

button:hover::before {
    left: 100%;
}

/* verde */
#yes {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    box-shadow: 0 0 20px rgba(34,197,94,0.4);
}

#yes:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(34,197,94,0.9);
}

/* rojo */
#no {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    color: white;
    box-shadow: 0 0 20px rgba(239,68,68,0.4);
}

#no:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(239,68,68,0.9);
}

/* click físico */
button:active {
    transform: scale(0.95);
    filter: brightness(0.9);
}

/* ===== GRID ===== */
h1 {
    position: fixed;
    top: 10px;
    left: 15px;
    color: white;
    font-size: 14px;
    opacity: 0.7;
    z-index: 10;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    grid-auto-rows: 120px;
    grid-auto-flow: dense;
    gap: 6px;
    padding: 10px;
}

.card {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    transition: 0.3s;
    cursor: pointer;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.85);
    transition: 0.3s;
}

.card span {
    position: absolute;
    bottom: 5px;
    left: 5px;
    font-size: 10px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 2px 5px;
    border-radius: 5px;
}

.big { grid-column: span 2; grid-row: span 2; }
.wide { grid-column: span 2; }
.tall { grid-row: span 2; }

.card:nth-child(odd) { transform: rotate(-1deg); }
.card:nth-child(even) { transform: rotate(1deg); }

.card:hover {
    transform: scale(1.07) rotate(0deg);
    z-index: 2;
}

.card:hover img {
    filter: brightness(1);
}

@keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
    <div class="overlay-card">
        <div class="overlay-icon">🔞</div>
        <h2>¿Eres mayor de 18 años?</h2>
        <p>Accede a la galería de la comunidad</p>

        <div class="buttons">
            <button id="yes">Sí, soy mayor de 18 años</button>
            <button id="no">No, no lo soy</button>
        </div>
    </div>
</div>

<h1>📸 La Galería VIP</h1>

<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById("grid");

/* ===== GENERAR 200 ITEMS ===== */
const data = [];
const patterns = ["", "big", "", "tall", "", "wide", "", "", "big", ""];

for (let i = 1; i <= 200; i++) {
    data.push({
        name: "Usuario " + i,
        img: "https://picsum.photos/400?random=" + i,
        class: patterns[i % patterns.length]
    });
}

function render(items) {
    items.forEach(item => {
        const div = document.createElement("div");
        div.className = "card " + item.class;

        div.innerHTML = `
            <img src="${item.img}">
            <span>${item.name}</span>
        `;

        grid.appendChild(div);
    });
}

render(data);
render(data);

/* LOOP INFINITO */
let isAdjusting = false;

window.addEventListener("scroll", () => {
    if (isAdjusting) return;

    const scrollTop = window.scrollY;
    const totalHeight = document.body.scrollHeight;
    const half = totalHeight / 2;

    if (scrollTop > half) {
        isAdjusting = true;
        window.scrollTo(0, scrollTop - half);
        isAdjusting = false;
    }

    if (scrollTop < 10) {
        isAdjusting = true;
        window.scrollTo(0, scrollTop + half);
        isAdjusting = false;
    }
});
</script>

<script>
document.getElementById("yes").onclick = () => {
    const overlay = document.getElementById("overlay");

    overlay.style.opacity = "0";
    overlay.style.transform = "scale(1.1)";

    setTimeout(() => {
        overlay.style.display = "none";
        document.body.style.overflow = "auto";
    }, 400);
};

document.getElementById("no").onclick = () => {
    window.location.href = "https://www.youtube.com/watch?v=XqZsoesa55w";
};
</script>

</body>
</html>
